<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premium Photo Gallery</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    color:#fff;
    background:
    radial-gradient(circle at 20% 20%,#2563eb55,transparent 30%),
    radial-gradient(circle at 80% 80%,#9333ea44,transparent 30%),
    linear-gradient(135deg,#020617,#0f172a,#020617);
}

/* HEADER */
header{
    text-align:center;
    padding:55px 15px;
    background:rgba(15,23,42,.75);
    border-bottom:1px solid #ffffff18;
    box-shadow:0 15px 50px #0008;
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:22px;
    font-size:35px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    box-shadow:0 15px 40px #2563eb55;
}

h1{
    font-size:clamp(28px,6vw,48px);
}

header p{
    margin-top:10px;
    color:#94a3b8;
}

/* LOGIN AREA */
.login-area{
    text-align:center;
    padding:30px 15px 10px;
}

.admin-login-btn{
    padding:14px 28px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 10px 30px #2563eb44;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

.admin-login-btn:active{
    transform:scale(.96);
}

/* ADMIN PANEL */
#adminPanel{
    display:none;
    text-align:center;
    padding:20px 15px;
}

/* UPLOAD BUTTON */
.upload-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:230px;
    padding:17px 25px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#16a34a,#059669);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 12px 30px #16a34a44;
    transition:.2s;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:manipulation;
}

.upload-btn:active{
    transform:scale(.96);
}

/* HIDDEN FILE INPUT */
#photoUpload{
    display:none;
}

.counter{
    margin-top:12px;
    color:#94a3b8;
    font-size:14px;
}

/* LOGOUT */
.logout-btn{
    margin-top:12px;
    padding:10px 20px;
    border:1px solid #ffffff20;
    border-radius:10px;
    background:#ffffff10;
    color:#cbd5e1;
    cursor:pointer;
    touch-action:manipulation;
}

/* GALLERY */
.gallery{
    max-width:1200px;
    margin:auto;
    padding:30px 20px 70px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:20px;
}

.photo{
    position:relative;
    overflow:hidden;
    border-radius:18px;
    background:#111827;
    border:1px solid #ffffff12;
    box-shadow:0 15px 35px #0007;
}

.photo img{
    width:100%;
    height:270px;
    object-fit:cover;
    display:block;
    cursor:pointer;
    transition:.35s;
}

.photo:hover img{
    transform:scale(1.06);
}

/* DELETE BUTTON */
.delete-btn{
    position:absolute;
    top:10px;
    right:10px;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#dc2626;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    z-index:5;
    display:none;
}

/* EMPTY */
.empty{
    grid-column:1/-1;
    text-align:center;
    padding:70px 20px;
    color:#64748b;
}

.empty span{
    display:block;
    font-size:55px;
    margin-bottom:15px;
}

/* LOGIN POPUP */
.login-overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000b;
    backdrop-filter:blur(10px);
    z-index:9999;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:380px;
    padding:35px 25px;
    text-align:center;
    border-radius:24px;
    background:#111827;
    border:1px solid #ffffff18;
    box-shadow:0 30px 80px #000;
}

.login-box h2{
    margin-bottom:10px;
}

.login-box p{
    color:#94a3b8;
    margin-bottom:20px;
}

#password{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #334155;
    background:#020617;
    color:#fff;
    outline:none;
    font-size:16px;
    text-align:center;
}

.login-submit{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.cancel{
    margin-top:15px;
    color:#94a3b8;
    cursor:pointer;
}

/* FULL IMAGE VIEWER */
.viewer{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000f;
    z-index:10000;
    padding:20px;
}

.viewer img{
    max-width:95%;
    max-height:90vh;
    object-fit:contain;
    border-radius:12px;
}

.close{
    position:absolute;
    top:15px;
    right:20px;
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#ffffff18;
    font-size:35px;
    cursor:pointer;
}

/* FOOTER */
footer{
    padding:30px;
    text-align:center;
    color:#64748b;
    background:#020617;
}

/* MOBILE */
@media(max-width:600px){

    header{
        padding:45px 15px;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
        padding:20px 10px 50px;
    }

    .photo img{
        height:190px;
    }

    .upload-btn,
    .admin-login-btn{
        width:90%;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        📸
    </div>

    <h1>Premium Photo Gallery</h1>

    <p>Explore our latest photos</p>

</header>


<!-- LOGIN BUTTON -->
<div class="login-area" id="loginArea">

    <button
        type="button"
        class="admin-login-btn"
        onclick="openLogin()">

        🔐 Admin Login

    </button>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel">

    <!-- DIRECT JAVASCRIPT BUTTON -->
    <button
        type="button"
        class="upload-btn"
        id="uploadButton"
        onclick="openGallery()">

        📤 Upload Photos

    </button>

    <!-- MOBILE FILE PICKER -->
    <input
        type="file"
        id="photoUpload"
        accept="image/*"
        multiple>

    <div
        class="counter"
        id="counter">

        0 / 10 Photos

    </div>

    <button
        type="button"
        class="logout-btn"
        onclick="logout()">

        🔒 Logout

    </button>

</div>


<!-- GALLERY -->
<div
    class="gallery"
    id="gallery">

    <div
        class="empty"
        id="empty">

        <span>🖼️</span>

        No photos available yet

    </div>

</div>


<!-- LOGIN POPUP -->
<div
    class="login-overlay"
    id="loginOverlay">

    <div class="login-box">

        <div style="font-size:45px;margin-bottom:15px;">
            🔐
        </div>

        <h2>Admin Login</h2>

        <p>
            Only administrator can upload photos
        </p>

        <input
            type="password"
            id="password"
            placeholder="Enter Admin Password"
            autocomplete="off">

        <button
            type="button"
            class="login-submit"
            onclick="login()">

            🔓 Login

        </button>

        <div
            class="cancel"
            onclick="closeLogin()">

            Cancel

        </div>

    </div>

</div>


<!-- FULL IMAGE VIEWER -->
<div
    class="viewer"
    id="viewer"
    onclick="closeViewer(event)">

    <div
        class="close"
        onclick="closeImage()">

        ×

    </div>

    <img
        id="bigImage"
        alt="Full Image">

</div>


<!-- FOOTER -->
<footer>

    © 2026 Premium Photo Gallery

</footer>


<script>

/* SETTINGS */

const ADMIN_PASSWORD = "PESI2026";

const MAX_PHOTOS = 10;

let adminLoggedIn = false;

let photoCount = 0;


/* =========================================
   OPEN LOGIN
========================================= */

function openLogin(){

    document.getElementById("loginOverlay").style.display = "flex";

    setTimeout(function(){

        document.getElementById("password").focus();

    },100);
}


/* =========================================
   CLOSE LOGIN
========================================= */

function closeLogin(){

    document.getElementById("loginOverlay").style.display = "none";

    document.getElementById("password").value = "";

}


/* =========================================
   LOGIN
========================================= */

function login(){

    const password =
        document.getElementById("password").value.trim();

    if(password === ADMIN_PASSWORD){

        adminLoggedIn = true;

        document.getElementById("loginOverlay").style.display = "none";

        document.getElementById("loginArea").style.display = "none";

        document.getElementById("adminPanel").style.display = "block";

        document.querySelectorAll(".delete-btn").forEach(function(btn){

            btn.style.display = "block";

        });

        alert("✅ Admin Login Successful!");

    }else{

        alert("❌ Wrong Password!");

        document.getElementById("password").value = "";

        document.getElementById("password").focus();

    }
}


/* =========================================
   ENTER KEY LOGIN
========================================= */

document.getElementById("password").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


/* =========================================
   OPEN MOBILE GALLERY
========================================= */

function openGallery(){

    if(!adminLoggedIn){

        alert("🔐 Please login as Admin first.");

        return;

    }

    const input =
        document.getElementById("photoUpload");

    if(photoCount >= MAX_PHOTOS){

        alert("⚠️ Maximum 10 photos allowed.");

        return;

    }

    /* DIRECTLY OPEN PHONE FILE PICKER */
    input.click();

}


/* =========================================
   FILE INPUT
========================================= */

document.getElementById("photoUpload").addEventListener(
    "change",
    function(){

        const files =
            Array.from(this.files);

        if(files.length === 0){

            return;

        }

        const remaining =
            MAX_PHOTOS - photoCount;

        if(remaining <= 0){

            alert("⚠️ Maximum 10 photos allowed.");

            this.value = "";

            return;

        }

        const selectedFiles =
            files.slice(0, remaining);

        if(files.length > remaining){

            alert(
                "⚠️ Only " +
                remaining +
                " more photo(s) can be added."
            );

        }

        selectedFiles.forEach(function(file){

            if(!file.type.startsWith("image/")){

                alert(
                    "❌ " +
                    file.name +
                    " is not a valid image."
                );

                return;

            }

            const reader =
                new FileReader();

            reader.onload = function(event){

                addPhoto(event.target.result);

            };

            reader.onerror = function(){

                alert(
                    "❌ Could not read " +
                    file.name
                );

            };

            reader.readAsDataURL(file);

        });

        /* Reset so same image can be selected again */
        this.value = "";

    }
);


/* =========================================
   ADD PHOTO
========================================= */

function addPhoto(src){

    if(photoCount >= MAX_PHOTOS){

        return;

    }

    const gallery =
        document.getElementById("gallery");

    const empty =
        document.getElementById("empty");

    if(empty){

        empty.remove();

    }

    const photo =
        document.createElement("div");

    photo.className = "photo";


    /* IMAGE */

    const img =
        document.createElement("img");

    img.src = src;

    img.alt = "Uploaded Photo";

    img.loading = "lazy";

    img.onclick = function(){

        openImage(src);

    };


    /* DELETE BUTTON */

    const deleteBtn =
        document.createElement("button");

    deleteBtn.type = "button";

    deleteBtn.className = "delete-btn";

    deleteBtn.innerHTML = "🗑️";

    deleteBtn.title = "Delete Photo";


    if(adminLoggedIn){

        deleteBtn.style.display = "block";

    }


    deleteBtn.onclick = function(event){

        event.stopPropagation();

        if(confirm("Delete this photo?")){

            photo.remove();

            photoCount--;

            updateCounter();

            if(photoCount === 0){

                showEmpty();

            }

        }

    };


    photo.appendChild(img);

    photo.appendChild(deleteBtn);

    gallery.appendChild(photo);

    photoCount++;

    updateCounter();

}


/* =========================================
   UPDATE COUNTER
========================================= */

function updateCounter(){

    document.getElementById("counter").innerText =
        photoCount +
        " / " +
        MAX_PHOTOS +
        " Photos";

}


/* =========================================
   EMPTY GALLERY
========================================= */

function showEmpty(){

    const gallery =
        document.getElementById("gallery");

    if(document.getElementById("empty")){

        return;

    }

    const empty =
        document.createElement("div");

    empty.className = "empty";

    empty.id = "empty";

    empty.innerHTML = `
        <span>🖼️</span>
        No photos available yet
    `;

    gallery.appendChild(empty);

}


/* =========================================
   OPEN FULL IMAGE
========================================= */

function openImage(src){

    document.getElementById("viewer").style.display = "flex";

    document.getElementById("bigImage").src = src;

}


/* =========================================
   CLOSE FULL IMAGE
========================================= */

function closeImage(){

    document.getElementById("viewer").style.display = "none";

    document.getElementById("bigImage").src = "";

}


/* =========================================
   CLOSE VIEWER
========================================= */

function closeViewer(event){

    if(event.target.id === "viewer"){

        closeImage();

    }

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

    adminLoggedIn = false;

    document.getElementById("adminPanel").style.display = "none";

    document.getElementById("loginArea").style.display = "block";

    document.querySelectorAll(".delete-btn").forEach(function(btn){

        btn.style.display = "none";

    });

}


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeImage();

            closeLogin();

        }

    }
);

</script>

</body>
</html>
