<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Cricket Scores</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#008f63,#004c38);
    padding:22px 15px;
    text-align:center;
}

header h1{
    font-size:28px;
}

header p{
    margin-top:7px;
    color:#d5fff0;
}

.container{
    width:94%;
    max-width:900px;
    margin:20px auto;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
}

.live{
    color:#48ff9c;
    font-size:14px;
}

.refresh{
    border:0;
    background:#00a86b;
    color:white;
    padding:11px 17px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.loading,
.error,
.empty{
    background:#101d2d;
    border-radius:15px;
    padding:25px;
    text-align:center;
}

.error{
    color:#ff8d8d;
}

.match{
    background:#101d2d;
    border:1px solid #24384f;
    border-radius:16px;
    margin-bottom:18px;
    overflow:hidden;
}

.match-head{
    background:#17283c;
    padding:15px;
}

.match-title{
    font-size:18px;
    font-weight:bold;
}

.match-meta{
    color:#9fb0c2;
    margin-top:7px;
    font-size:13px;
}

.live-badge{
    display:inline-block;
    background:#d71920;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    margin-top:10px;
}

.scores{
    padding:17px;
}

.team{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:13px 0;
    border-bottom:1px solid #27394e;
}

.team:last-child{
    border-bottom:0;
}

.team-name{
    font-size:16px;
    font-weight:bold;
}

.team-score{
    font-size:21px;
    font-weight:bold;
    color:#5dffad;
}

.details{
    background:#0b1725;
    padding:15px;
}

.status{
    color:#ffd166;
    line-height:1.5;
}

.venue{
    color:#aab7c5;
    margin-top:7px;
    font-size:13px;
}

.open-match{
    width:100%;
    margin-top:12px;
    border:0;
    background:#008f63;
    color:white;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.scorecard{
    display:none;
    border-top:1px solid #27394e;
    padding:15px;
    background:#091522;
}

.scorecard.active{
    display:block;
}

.score-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.info-box{
    background:#111f30;
    padding:13px;
    border-radius:10px;
    margin-bottom:10px;
}

.info-label{
    color:#8999aa;
    font-size:12px;
}

.info-value{
    margin-top:4px;
    font-size:17px;
    font-weight:bold;
}

.balls{
    margin-top:10px;
}

.ball{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:36px;
    height:36px;
    border-radius:50%;
    background:#17283c;
    margin:3px;
    font-size:12px;
}

.updated{
    text-align:center;
    color:#718196;
    font-size:12px;
    margin:18px 0;
}

footer{
    text-align:center;
    padding:25px;
    color:#66768a;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <h1>🏏 Live Cricket</h1>
    <p>Live Scores • Overs • Wickets • Ball by Ball</p>
</header>

<div class="container">

    <div class="top">
        <div class="live" id="connection">
            ● Connecting...
        </div>

        <button class="refresh" onclick="loadMatches()">
            🔄 Refresh
        </button>
    </div>

    <div id="matches">
        <div class="loading">
            🏏 Loading live matches...
        </div>
    </div>

    <div class="updated" id="updated"></div>

</div>

<footer>
    Live Cricket Score
</footer>


<script>

/* =================================================
   PASTE YOUR NEW CRICWIX API KEY BELOW
   ================================================= */

const API_KEY = "ecab8eb641b0b0912f816b7d4dd7656b2d8031e3b174300f333c7d540dc8f60a";


/* =================================================
   API
   ================================================= */

const BASE_URL = "https://api.cricwix.com/ext/v1";


/* =================================================
   LOAD LIVE MATCHES
   ================================================= */

async function loadMatches(){

    const box = document.getElementById("matches");
    const connection = document.getElementById("connection");

    if(
        API_KEY === "YOUR_NEW_API_KEY_HERE" ||
        API_KEY.trim() === ""
    ){

        connection.textContent = "● API Key Required";
        connection.style.color = "#ff7777";

        box.innerHTML = `
            <div class="error">
                <h3>⚠️ API Key نہیں لگی</h3>
                <p style="margin-top:10px">
                    JavaScript میں اپنی Cricwix API Key ڈالیں۔
                </p>
            </div>
        `;

        return;
    }


    connection.textContent = "● Loading...";
    connection.style.color = "#ffd166";


    try{

        const response = await fetch(
            BASE_URL + "/fixtures?status=live",
            {
                method:"GET",
                headers:{
                    "X-Api-Key":API_KEY,
                    "Accept":"application/json"
                }
            }
        );


        if(!response.ok){

            if(response.status === 401){
                throw new Error(
                    "API Key غلط ہے یا invalid ہو چکی ہے۔"
                );
            }

            if(response.status === 429){
                throw new Error(
                    "Daily API limit ختم ہو گئی ہے۔"
                );
            }

            throw new Error(
                "API Error: HTTP " + response.status
            );
        }


        const result = await response.json();

        console.log("Cricwix Response:",result);


        const matches = getMatches(result);


        if(!matches.length){

            box.innerHTML = `
                <div class="empty">
                    <h3>🏏 ابھی کوئی Live Match نہیں</h3>
                    <p style="margin-top:8px">
                        اس وقت API نے کوئی live match واپس نہیں کیا۔
                    </p>
                </div>
            `;

        }else{

            box.innerHTML = "";

            matches.forEach((match,index)=>{

                box.innerHTML += createMatch(
                    match,
                    index
                );

            });

        }


        connection.textContent =
            "● Live API Connected";

        connection.style.color =
            "#48ff9c";


        document.getElementById("updated").textContent =
            "Updated: " +
            new Date().toLocaleTimeString();


    }catch(error){

        console.error(error);

        connection.textContent =
            "● API Error";

        connection.style.color =
            "#ff7777";


        box.innerHTML = `
            <div class="error">

                <h3>❌ Live Score Load نہیں ہو سکا</h3>

                <p style="margin-top:10px">
                    ${escapeHTML(error.message)}
                </p>

                <button
                    class="refresh"
                    style="margin-top:15px"
                    onclick="loadMatches()">
                    Try Again
                </button>

            </div>
        `;
    }
}


/* =================================================
   GET MATCH ARRAY
   ================================================= */

function getMatches(result){

    if(!result) return [];

    if(Array.isArray(result.data)){
        return result.data;
    }

    if(result.data && Array.isArray(result.data.fixtures)){
        return result.data.fixtures;
    }

    if(Array.isArray(result.fixtures)){
        return result.fixtures;
    }

    return [];
}


/* =================================================
   CREATE MATCH
   ================================================= */

function createMatch(match,index){

    const id =
        match.match_id ||
        match.id ||
        match.fixture_id ||
        index;


    const home =
        match.localteam ||
        match.home_team ||
        match.home ||
        match.teams?.home ||
        "Home Team";


    const away =
        match.visitorteam ||
        match.away_team ||
        match.away ||
        match.teams?.away ||
        "Away Team";


    const homeScore =
        match.localteam_score ||
        match.home_score ||
        match.score?.home ||
        "-";


    const awayScore =
        match.visitorteam_score ||
        match.away_score ||
        match.score?.away ||
        "-";


    const format =
        match.format ||
        match.type ||
        match.match_type ||
        "Cricket";


    const venue =
        match.venue ||
        match.venue_name ||
        "Venue unavailable";


    const status =
        match.status ||
        "LIVE";


    return `

        <div class="match">

            <div class="match-head">

                <div class="match-title">

                    ${escapeHTML(home)}
                    vs
                    ${escapeHTML(away)}

                </div>

                <div class="match-meta">

                    ${escapeHTML(format)}

                </div>

                <span class="live-badge">
                    🔴 LIVE
                </span>

            </div>


            <div class="scores">

                <div class="team">

                    <div class="team-name">
                        ${escapeHTML(home)}
                    </div>

                    <div class="team-score">
                        ${escapeHTML(homeScore)}
                    </div>

                </div>


                <div class="team">

                    <div class="team-name">
                        ${escapeHTML(away)}
                    </div>

                    <div class="team-score">
                        ${escapeHTML(awayScore)}
                    </div>

                </div>

            </div>


            <div class="details">

                <div class="status">
                    ${escapeHTML(status)}
                </div>

                <div class="venue">
                    📍 ${escapeHTML(venue)}
                </div>


                <button
                    class="open-match"
                    onclick="loadLiveMatch('${escapeHTML(String(id))}',this)">

                    📊 Full Live Score & Ball-by-Ball

                </button>

            </div>


            <div class="scorecard"></div>

        </div>

    `;
}


/* =================================================
   LIVE MATCH DETAILS
   ================================================= */

async function loadLiveMatch(id,button){

    const match =
        button.closest(".match");

    const scorecard =
        match.querySelector(".scorecard");


    if(scorecard.classList.contains("active")){

        scorecard.classList.remove("active");

        button.textContent =
            "📊 Full Live Score & Ball-by-Ball";

        return;
    }


    button.textContent =
        "⏳ Loading...";


    try{

        const response = await fetch(
            BASE_URL + "/live/" +
            encodeURIComponent(id),
            {
                method:"GET",
                headers:{
                    "X-Api-Key":API_KEY,
                    "Accept":"application/json"
                }
            }
        );


        if(!response.ok){

            throw new Error(
                "Live match API error: HTTP " +
                response.status
            );
        }


        const result =
            await response.json();


        console.log(
            "Live Match:",
            result
        );


        scorecard.innerHTML =
            createScorecard(result);


        scorecard.classList.add("active");


        button.textContent =
            "▲ Hide Live Details";


    }catch(error){

        scorecard.innerHTML = `

            <div class="error">

                ❌ ${escapeHTML(error.message)}

            </div>

        `;

        scorecard.classList.add("active");

        button.textContent =
            "📊 Full Live Score & Ball-by-Ball";
    }
}


/* =================================================
   SCORECARD
   ================================================= */

function createScorecard(result){

    const data =
        result?.data || result;


    const match =
        data?.match ||
        data;


    const score =
        data?.score ||
        match?.score ||
        {};


    const current =
        data?.current ||
        {};


    let html = `

        <div class="score-title">
            🏏 Live Scorecard
        </div>

    `;


    /* SCORE SUMMARY */

    html += `

        <div class="info-box">

            <div class="info-label">
                SCORE
            </div>

            <div class="info-value">

                ${escapeHTML(
                    score.summary ||
                    score.display ||
                    current.score ||
                    "Live score available"
                )}

            </div>

        </div>

    `;


    /* OVERS */

    html += `

        <div class="info-box">

            <div class="info-label">
                OVERS
            </div>

            <div class="info-value">

                ${escapeHTML(
                    score.overs ||
                    current.overs ||
                    "-"
                )}

            </div>

        </div>

    `;


    /* CRR */

    html += `

        <div class="info-box">

            <div class="info-label">
                CRR
            </div>

            <div class="info-value">

                ${escapeHTML(
                    score.crr ||
                    current.crr ||
                    "-"
                )}

            </div>

        </div>

    `;


    /* BATSMEN */

    const batsmen =
        data?.batsmen ||
        current?.batsmen ||
        [];


    if(Array.isArray(batsmen) && batsmen.length){

        html += `
            <div class="info-box">
                <div class="info-label">
                    BATSMEN
                </div>
        `;


        batsmen.forEach(player=>{

            html += `

                <div style="
                    margin-top:9px;
                    padding-top:9px;
                    border-top:1px solid #26384d;
                ">

                    <b>
                        ${escapeHTML(
                            player.name ||
                            player.player ||
                            "Batter"
                        )}
                    </b>

                    <br>

                    ${escapeHTML(
                        player.runs ??
                        player.r ??
                        "-"
                    )}
                    runs

                    ·

                    ${escapeHTML(
                        player.balls ??
                        player.b ??
                        "-"
                    )}
                    balls

                </div>

            `;

        });


        html += `</div>`;
    }


    /* BOWLER */

    const bowler =
        data?.bowler ||
        current?.bowler;


    if(bowler){

        html += `

            <div class="info-box">

                <div class="info-label">
                    BOWLER
                </div>

                <div class="info-value">

                    ${escapeHTML(
                        bowler.name ||
                        bowler.player ||
                        "Bowler"
                    )}

                </div>

            </div>

        `;
    }


    /* BALLS */

    const balls =
        data?.balls ||
        data?.deliveries ||
        current?.balls ||
        [];


    if(Array.isArray(balls) && balls.length){

        html += `

            <div class="info-box">

                <div class="info-label">
                    BALL-BY-BALL
                </div>

                <div class="balls">

        `;


        balls.slice(-12).forEach(ball=>{

            const value =
                ball.runs ??
                ball.score ??
                ball.result ??
                ball.total ??
                "•";


            html += `

                <span class="ball">
                    ${escapeHTML(value)}
                </span>

            `;

        });


        html += `

                </div>

            </div>

        `;
    }


    return html;
}


/* =================================================
   SECURITY
   ================================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =================================================
   START
   ================================================= */

loadMatches();


/*
   Refresh every 60 seconds.

   Free API has a daily request limit,
   so do NOT use very short intervals.
*/

setInterval(
    loadMatches,
    60000
);

</script>

</body>
</html>
