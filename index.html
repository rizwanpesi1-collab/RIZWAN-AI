
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizwan Cricket Overlay</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:transparent;color:white;
  font-family:Arial,sans-serif;overflow:hidden
}
.board{
  width:100%;max-width:1000px;margin:15px auto;
  padding:16px;border:2px solid #18e5b0;border-radius:18px;
  background:linear-gradient(120deg,#06152bfa,#111827f5);
  box-shadow:0 0 22px #00e5a455
}
.heading{
  text-align:center;color:#18e5b0;font-size:clamp(14px,3vw,22px);
  font-weight:bold;letter-spacing:2px;margin-bottom:14px
}
.teams{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;text-align:center
}
.team{font-size:clamp(15px,3.5vw,25px);font-weight:bold}
.flag{font-size:clamp(25px,5vw,42px)}
.score{
  font-size:clamp(30px,7vw,54px);font-weight:900;
  color:#fff;text-shadow:0 0 14px #00d9ff
}
.middle{
  font-size:clamp(11px,2.5vw,16px);color:#ffd166;
  font-weight:bold;white-space:nowrap
}
.details{
  display:flex;justify-content:center;flex-wrap:wrap;gap:10px;
  margin-top:15px
}
.pill{
  background:#ffffff12;border:1px solid #ffffff25;
  padding:9px 13px;border-radius:9px;font-size:clamp(11px,2.5vw,15px)
}
.status{text-align:center;margin-top:12px;color:#9fb4d0;font-size:11px}
@media(max-width:450px){
 .board{padding:10px;margin:5px auto}
 .teams{gap:5px}
 .pill{padding:7px}
}
</style>
</head>
<body>
<div class="board">
  <div class="heading">🏏 RIZWAN CRICKET LIVE</div>
  <div class="teams">
    <div class="team">
      <div class="flag" id="flagA">🇵🇰</div>
      <div id="teamA">PAKISTAN</div>
      <div class="score" id="scoreA">0/0</div>
    </div>
    <div class="middle">
      <div>VS</div>
      <div id="oversA">0.0 OV</div>
      <div style="margin-top:8px">TARGET</div>
      <div id="target">—</div>
    </div>
    <div class="team">
      <div class="flag" id="flagB">🏴</div>
      <div id="teamB">ENGLAND</div>
      <div class="score" id="scoreB">0/0</div>
    </div>
  </div>
  <div class="details">
    <div class="pill">CRR: <b id="crr">0.00</b></div>
    <div class="pill">RRR: <b id="rrr">—</b></div>
    <div class="pill">MATCH: <b id="matchStatus">WAITING</b></div>
  </div>
  <div class="status" id="updated">اسکور ڈیٹا لوڈ ہو رہا ہے...</div>
</div>

<script>
const params = new URLSearchParams(location.search);
const dataUrl = params.get("data") || "./score.json";

function setText(id, value) {
  document.getElementById(id).textContent = value ?? "—";
}

async function updateScore() {
  try {
    const response = await fetch(dataUrl + "?t=" + Date.now(), {
      cache: "no-store"
    });
    if (!response.ok) throw new Error("Score file unavailable");

    const d = await response.json();

    setText("teamA", d.teamA || "PAKISTAN");
    setText("teamB", d.teamB || "ENGLAND");
    setText("flagA", d.flagA || "🇵🇰");
    setText("flagB", d.flagB || "🏴");
    setText("scoreA", `${d.runsA ?? 0}/${d.wicketsA ?? 0}`);
    setText("scoreB", `${d.runsB ?? 0}/${d.wicketsB ?? 0}`);
    setText("oversA", `${d.oversA ?? "0.0"} OV`);
    setText("target", d.target ?? "—");
    setText("crr", d.crr ?? "0.00");
    setText("rrr", d.rrr ?? "—");
    setText("matchStatus", d.status || "LIVE");
    setText("updated", "آخری ڈیٹا: " +
      new Date().toLocaleTimeString());

  } catch (error) {
    setText("updated", "ڈیٹا دستیاب نہیں — دوبارہ کوشش جاری ہے");
  }
}

updateScore();
setInterval(updateScore, 10000);
</script>
</body>
</html>
