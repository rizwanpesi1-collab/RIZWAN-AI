
<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizwan Cricket Overlay</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080d17;color:#fff;
  font-family:Arial,sans-serif;padding:16px
}
.container{max-width:900px;margin:auto}
h1{text-align:center;color:#22e6a8;font-size:26px}
.panel{
  background:#131d2c;border:1px solid #29394d;
  border-radius:14px;padding:16px;margin:14px 0
}
input,button{
  width:100%;padding:12px;margin:6px 0;
  border-radius:8px;border:1px solid #42536b;
  font-size:15px
}
input{background:#080d17;color:#fff}
button{
  background:#16c79a;color:#04130f;
  font-weight:bold;cursor:pointer;border:0
}
button.secondary{background:#30435c;color:white}
.status{color:#f7d774;overflow-wrap:anywhere}
.scoreboard{
  background:linear-gradient(135deg,#0b1726,#1a3043);
  border:2px solid #20e6aa;border-radius:18px;
  padding:20px;text-align:center
}
.teams{
  display:flex;align-items:center;justify-content:space-around;
  gap:10px
}
.team{width:40%;font-weight:bold;font-size:18px}
.flag{font-size:42px;display:block;margin-bottom:8px}
.team-score{font-size:24px;color:#26e8b1;margin-top:8px}
.middle{font-size:22px;color:#ffd66b;font-weight:bold}
.small{font-size:13px;color:#c5d2df}
#output{white-space:pre-wrap;overflow-wrap:anywhere;
background:#080d17;padding:12px;border-radius:8px}
.overlay-page{max-width:750px;margin:30px auto}
a{color:#51d9ff}
</style>
</head>

<body>
<div class="container" id="app">
  <h1>🏏 Rizwan Cricket Overlay</h1>

  <div class="panel">
    <b>1۔ CREX میچ کا لنک</b>
    <input id="crexUrl" value="https://crex.com/cricket-live-score/eng-vs-sl-3rd-odi-odi-tri-series-in-pakistan-2026-match-updates-13ND">
    <button onclick="testCrex()">CREX ڈیٹا چیک کریں</button>
    <div id="status" class="status">ٹیسٹ ابھی شروع نہیں ہوا۔</div>
  </div>

  <div class="panel">
    <b>2۔ ٹیموں کے نام اور جھنڈے</b>
    <input id="team1" value="England" placeholder="پہلی ٹیم">
    <input id="flag1" value="🏴" placeholder="پہلی ٹیم کا جھنڈا">
    <input id="score1" value="—" placeholder="پہلی ٹیم کا اسکور">
    <input id="team2" value="Sri Lanka" placeholder="دوسری ٹیم">
    <input id="flag2" value="🇱🇰" placeholder="دوسری ٹیم کا جھنڈا">
    <input id="score2" value="—" placeholder="دوسری ٹیم کا اسکور">
    <input id="overs" value="—" placeholder="اوورز">
    <input id="details" value="CREX سے ڈیٹا دستیاب ہونے کا انتظار ہے" placeholder="اضافی معلومات">
    <button onclick="updateBoard()">اسکور بورڈ اپڈیٹ کریں</button>
    <button class="secondary" onclick="makeOverlayLink()">اوورلے لنک بنائیں</button>
    <div id="overlayLink"></div>
  </div>

  <div class="panel">
    <b>3۔ لائیو اوورلے کا پری ویو</b>
    <div class="scoreboard" id="board">
      <div class="teams">
        <div class="team">
          <span class="flag" id="showFlag1">🏴</span>
          <span id="showTeam1">England</span>
          <div class="team-score" id="showScore1">—</div>
        </div>
        <div class="middle">VS</div>
        <div class="team">
          <span class="flag" id="showFlag2">🇱🇰</span>
          <span id="showTeam2">Sri Lanka</span>
          <div class="team-score" id="showScore2">—</div>
        </div>
      </div>
      <hr style="border-color:#34485d">
      <div id="showOvers">اوورز: —</div>
      <p id="showDetails" class="small">اسکور کی معلومات</p>
      <div class="small">Rizwan Cricket Overlay</div>
    </div>
  </div>

  <div class="panel">
    <b>4۔ CREX رسائی ٹیسٹ کا نتیجہ</b>
    <pre id="output">ابھی کوئی ٹیسٹ نہیں ہوا۔</pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function updateBoard(){
  $("showTeam1").textContent = $("team1").value || "Team 1";
  $("showTeam2").textContent = $("team2").value || "Team 2";
  $("showFlag1").textContent = $("flag1").value || "🏏";
  $("showFlag2").textContent = $("flag2").value || "🏏";
  $("showScore1").textContent = $("score1").value || "—";
  $("showScore2").textContent = $("score2").value || "—";
  $("showOvers").textContent = "اوورز: " + ($("overs").value || "—");
  $("showDetails").textContent = $("details").value || "";
}

async function testCrex(){
  const url = $("crexUrl").value.trim();
  $("status").textContent = "CREX صفحے تک رسائی چیک ہو رہی ہے...";
  $("output").textContent = "براہِ راست رسائی کی کوشش جاری ہے...";

  try{
    const response = await fetch(url, {
      method:"GET",
      mode:"cors",
      credentials:"omit"
    });

    const html = await response.text();
    const plain = html.replace(/<script[\s\S]*?<\/script>/gi," ")
                      .replace(/<style[\s\S]*?<\/style>/gi," ")
                      .replace(/<[^>]+>/g," ")
                      .replace(/\s+/g," ");

    $("status").textContent =
      "صفحہ ملا۔ HTTP Status: " + response.status +
      " — لیکن اس سے لائیو اسکور ملنے کی تصدیق نہیں ہوتی۔";

    $("output").textContent =
      "HTTP Status: " + response.status +
      "\nHTML Length: " + html.length +
      "\nEngland موجود: " + /england/i.test(plain) +
      "\nSri Lanka موجود: " + /sri lanka/i.test(plain) +
      "\n\nصفحے کے متن کا ابتدائی حصہ:\n" + plain.slice(0,1500);

  }catch(error){
    $("status").textContent =
      "براہِ راست رسائی ناکام۔ CORS یا نیٹ ورک کی پابندی ممکن ہے۔";
    $("output").textContent =
      "Error: " + error.message +
      "\n\nیہ ٹیسٹ CREX سے ڈیٹا حاصل نہیں کر سکا۔" +
      "\nPython سرور یا مجاز ڈیٹا فیڈ کی ضرورت پڑ سکتی ہے۔";
  }
}

function makeOverlayLink(){
  const url = new URL(window.location.href);
  url.searchParams.set("overlay","1");
  $("overlayLink").innerHTML =
    '<a href="' + url.href + '" target="_blank">' +
    "اوورلے کھولیں</a><br><span class='small'>" +
    url.href + "</span>";
}

function showOverlayIfRequested(){
  const params = new URLSearchParams(window.location.search);
  if(params.get("overlay") === "1"){
    $("app").innerHTML = `
      <div class="overlay-page">
        <div class="scoreboard">
          <div class="teams">
            <div class="team">
              <span class="flag" id="oFlag1">🏴</span>
              <span id="oTeam1">England</span>
              <div class="team-score" id="oScore1">—</div>
            </div>
            <div class="middle">VS</div>
            <div class="team">
              <span class="flag" id="oFlag2">🇱🇰</span>
              <span id="oTeam2">Sri Lanka</span>
              <div class="team-score" id="oScore2">—</div>
            </div>
          </div>
          <hr>
          <div id="oOvers">اوورز: —</div>
          <p id="oDetails">Rizwan Cricket Overlay</p>
        </div>
      </div>`;

    // یہ مقامی اسکور بورڈ کا ڈھانچہ ہے؛
    // اسے اصل ڈیٹا سے جوڑنے کے لیے فیڈ درکار ہے۔
  }
}

updateBoard();
showOverlayIfRequested();
</script>
</body>
</html>
