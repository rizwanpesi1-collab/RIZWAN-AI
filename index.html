<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest Cricket News Slideshow Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #f8fafc; }
        .slideshow-img { opacity: 0; transition: opacity 0.5s ease-in-out; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .slideshow-img.active { opacity: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6">

    <header class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4 flex items-center justify-between shadow-xl">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-red-600 text-white p-2.5 rounded-xl shadow">
                <i class="fa-solid fa-clapperboard text-lg"></i>
            </div>
            <div>
                <h1 class="text-base font-black uppercase tracking-wider text-white">Latest Cricket News Update</h1>
                <p class="text-xs text-slate-400">آٹومیٹک کرکٹ سلائیڈ شو اور وائس اسٹوڈیو</p>
            </div>
        </div>
        <span id="live-badge" class="hidden bg-red-600 text-white text-xs px-3 py-1 rounded-full font-bold animate-pulse">● LIVE</span>
    </header>

    <main class="w-full max-w-4xl flex flex-col gap-4">
        
        <!-- اسکرین اور سلائیڈ شو پلیئر -->
        <div class="relative w-full aspect-video rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-slate-950 flex items-center justify-center">
            
            <!-- بیک گراؤنڈ تصاویر سلائیڈ شو کنٹینر -->
            <div id="slideshow-container" class="absolute inset-0 w-full h-full bg-slate-900 flex items-center justify-center">
                <div id="placeholder-text" class="text-slate-500 text-sm font-semibold text-center p-4">
                    <i class="fa-solid fa-images text-3xl mb-2 block"></i>
                    براہ کرم نیچے دیئے گئے بٹن سے 40 سے 100 کرکٹ تصاویر منتخب کریں
                </div>
            </div>

            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-slate-950/40 pointer-events-none"></div>

            <!-- برانڈنگ لوگو اور ٹائٹل -->
            <div class="absolute top-4 right-4 bg-red-600 text-white font-black text-xs px-3 py-1 rounded-md shadow-lg z-20">
                LATEST CRICKET NEWS UPDATE
            </div>

            <!-- نیچے چلنے والی نیوز ٹِکر -->
            <div class="absolute bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-700 px-4 py-2.5 z-20 flex items-center">
                <span class="bg-red-600 text-white font-black text-[10px] px-2 py-0.5 rounded uppercase tracking-wider ml-3 shrink-0">NEWS</span>
                <p id="ticker-text" class="text-xs font-semibold text-slate-100 truncate">خوش آمدید! تازہ ترین کرکٹ خبریں یہاں شو ہوں گی۔</p>
            </div>
        </div>

        <!-- کنٹرول پینل -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">زبان منتخب کریں</label>
                    <select id="lang-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white">
                        <option value="ur-PK">اردو (Urdu)</option>
                        <option value="hi-IN">ہندی (Hindi)</option>
                        <option value="en-US">انگلش (English)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">اسکرپٹ کا سائز</label>
                    <select id="script-type" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-xs text-white" onchange="loadPresetScript()">
                        <option value="short">شارٹ اسکرپٹ (Short)</option>
                        <option value="long">لانگ اسکرپٹ (Long)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">کرکٹ تصاویر (40-100+)</label>
                    <input type="file" id="image-upload" accept="image/*" multiple class="w-full text-xs text-slate-400 file:mr-2 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">نیوز اسکرپٹ (آپ خود بھی لکھ سکتے ہیں):</label>
                <textarea id="user-script" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-100 focus:outline-none focus:border-blue-500 resize-none" placeholder="خبر یہاں درج کریں..."></textarea>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                <div class="flex gap-2">
                    <button onclick="startBroadcast()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-5 rounded-xl text-xs shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> خبر شروع کریں
                    </button>
                    <button onclick="stopBroadcast()" class="bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow transition flex items-center gap-2">
                        <i class="fa-solid fa-stop"></i> روکیں
                    </button>
                </div>
                <span id="status-text" class="text-xs text-slate-400 font-medium">تیار ہے</span>
            </div>

        </section>
    </main>

    <script>
        let imageFiles = [];
        let currentImgIndex = 0;
        let slideInterval = null;
        let speechSynth = window.speechSynthesis;

        // مختلف زبانوں اور سائز کے لیے پری سیٹ اسکرپٹس
        const scripts = {
            'ur-PK': {
                short: "السلام علیکم! لیٹسٹ کرکٹ نیوز اپڈیٹ میں خوش آمدید۔ آج کے اہم میچ میں شاندار کارکردگی دیکھنے کو ملی۔ کھلاڑیوں نے بہترین کھیل پیش کیا۔ مزید اپڈیٹس کے لیے جڑے رہیں۔",
                long: "السلام علیکم ناظرین، لیٹسٹ کرکٹ نیوز اپڈیٹ میں آپ کا خیرمقدم ہے۔ آج کی اہم ترین کرکٹ خبروں میں پاکستان، انڈیا اور دیگر بین الاقوامی ٹیموں کے میچز کی تفصیلات شامل ہیں۔ کھلاڑیوں نے پچ پر شاندار کھیل کا مظاہرہ کیا اور شائقین کو بہترین تفریح فراہم کی۔ ریکارڈز اور اساتس کے لحاظ سے یہ سیزن انتہائی دلچسپ ثابت ہو رہا ہے۔ تمام تازہ ترین اپڈیٹس کے لیے ہمارے ساتھ رہیں۔"
            },
            'hi-IN': {
                short: "नमस्कार! लेटेस्ट क्रिकेट न्यूज़ अपडेट में आपका स्वागत है। आज के मैच में खिलाड़ियों ने शानदार प्रदर्शन किया। अधिक अपडेट के लिए बने रहें।",
                long: "नमस्कार दर्शकों, लेटेस्ट क्रिकेट न्यूज़ अपडेट में आपका स्वागत है। आज की सबसे महत्वपूर्ण क्रिकेट खबरों में भारत, पाकिस्तान और अन्य अंतरराष्ट्रीय टीमों के मैचों का रोमांचक प्रदर्शन शामिल है। खिलाड़ियों ने मैदान पर बेहतरीन खेल दिखाया है। सभी ताज़ा अपडेट के लिए बने रहें।"
            },
            'en-US': {
                short: "Welcome to Latest Cricket News Update. Today's matches brought incredible performances and thrilling moments. Stay tuned for more updates.",
                long: "Hello viewers, welcome to Latest Cricket News Update. In today's top cricket stories, we cover major match highlights, player statistics, and remarkable moments from international cricket. Stay tuned as we bring you all the latest updates live from the studio."
            }
        };

        function loadPresetScript() {
            const lang = document.getElementById('lang-select').value;
            const type = document.getElementById('script-type').value;
            document.getElementById('user-script').value = scripts[lang][type];
        }

        // تصاویر اپ لوڈ کرنے کا فنکشن
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            imageFiles = files.map(file => URL.createObjectURL(file));
            currentImgIndex = 0;
            
            const container = document.getElementById('slideshow-container');
            container.innerHTML = '';
            
            imageFiles.forEach((url, index) => {
                const img = document.createElement('img');
                img.src = url;
                img.className = `slideshow-img ${index === 0 ? 'active' : ''}`;
                container.appendChild(img);
            });

            document.getElementById('status-text').textContent = `${imageFiles.length} تصاویر کامیابی سے لوڈ ہو گئیں`;
        });

        document.getElementById('lang-select').addEventListener('change', loadPresetScript);
        window.onload = loadPresetScript;

        function startBroadcast() {
            const scriptText = document.getElementById('user-script').value;
            if (!scriptText.trim()) {
                alert('براہ کرم پہلے اسکرپٹ درج کریں!');
                return;
            }

            if (imageFiles.length === 0) {
                alert('براہ کرم کم از کم کچھ کرکٹ تصاویر اپ لوڈ کریں!');
                return;
            }

            document.getElementById('ticker-text').textContent = scriptText;
            document.getElementById('live-badge').classList.remove('hidden');
            document.getElementById('status-text').textContent = "براڈکاسٹ جاری ہے...";

            // 2 سیکنڈ بعد تصویر تبدیل کرنے کا سلائیڈ شو شروع کریں
            if (slideInterval) clearInterval(slideInterval);
            slideInterval = setInterval(() => {
                const imgs = document.querySelectorAll('.slideshow-img');
                if (imgs.length === 0) return;
                
                imgs[currentImgIndex].classList.remove('active');
                currentImgIndex = (currentImgIndex + 1) % imgs.length;
                imgs[currentImgIndex].classList.add('active');
            }, 2000);

            // براؤزر کی وائس سے بولنا شروع کریں
            if (speechSynth) {
                speechSynth.cancel();
                const utterance = new SpeechSynthesisUtterance(scriptText);
                utterance.lang = document.getElementById('lang-select').value;
                utterance.rate = 0.95;

                utterance.onend = function() {
                    stopBroadcast();
                };

                speechSynth.speak(utterance);
            }
        }

        function stopBroadcast() {
            if (speechSynth) speechSynth.cancel();
            if (slideInterval) {
                clearInterval(slideInterval);
                slideInterval = null;
            }
            document.getElementById('live-badge').classList.add('hidden');
            document.getElementById('status-text').textContent = "روک دیا گیا";
        }
    </script>
</body>
</html>
